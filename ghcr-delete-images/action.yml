name: Delete ghcr.io images
description: |
  Delete container images from ghcr.io.
author: frantjc
branding:
  color: red
  icon: box
inputs:
  token:
    description: |
      GitHub token to authenticate with. Must have read:packages and delete:packages scopes.
    default: ${{ github.token }}
  tags:
    description: |
      Image tags to delete from ghcr.io.
    required: true
runs:
  using: node20
  main: ./dist/index.js
